# Traefik file-provider config — sincronizar em /etc/easypanel/traefik/config/lp-horizon.yml na VPS.
# Padrão herdado do DocsGrowth (decisão 2026-04-17 em decisions.md).
#
# Roteia consultoriahorizon.com.br pro container lp-horizon:3000.
#
# Pré-requisito: DNS A record APEX `consultoriahorizon.com.br` apontando pra 31.97.93.85. (OK)
#
# ⚠️ INCIDENTE 2026-08-15 — certificado vencido 18 dias. LEIA ANTES DE MEXER NO www.
#
# O certificado do apex venceu em 28/07/2026 e o Traefik falhou toda renovação diária:
#   "Error renewing ACME certificate: {consultoriahorizon.com.br []}
#    [www.consultoriahorizon.com.br] invalid authorization:
#    DNS problem: NXDOMAIN looking up A for www.consultoriahorizon.com.br"
#
# Causa: o `www` PERDEU o registro A em algum momento após a emissão original (abr/2026).
# O certificado emitido cobre os DOIS nomes (SANs: apex + www — confira com
# `openssl s_client ... | openssl x509 -text | grep -A2 "Subject Alternative Name"`).
# Na renovação, a Let's Encrypt valida o pedido inteiro ou nada: o `www` morto derrubava
# junto o apex, que resolve e funciona normalmente.
#
# 🔑 A LIÇÃO QUE CUSTOU CARO: remover o SAN daqui NÃO conserta um cert já emitido.
# A config governa certificados NOVOS; a renovação usa o conjunto de nomes do certificado
# QUE JÁ ESTÁ no acme.json. Enquanto o cert apex+www existir no cofre, o Traefik vai pedir
# os dois nomes independente do que estiver escrito neste arquivo. Conserto real = ou o
# nome volta a resolver no DNS, ou a entrada sai do acme.json (que guarda os certs de
# TODOS os sites da VPS — mexer ali é operação de risco, com backup obrigatório).
#
# Resolução escolhida pelo founder em 15/08: recriar `www A 31.97.93.85` no registro.br.
# Por isso o www CONTINUA aqui — ele voltou a existir.
#
# Regra derivada: nome só entra como SAN depois de resolver em DNS, e se um dia for
# aposentado, tirar do DNS exige tirar do cert (senão a renovação do principal morre junto).

http:
  routers:
    # Router APEX — preferencial (HTTPS)
    https-lp-horizon-apex:
      rule: "Host(`consultoriahorizon.com.br`)"
      entryPoints:
        - https
      service: lp-horizon-svc
      tls:
        certResolver: letsencrypt
        domains:
          - main: consultoriahorizon.com.br
            sans:
              - www.consultoriahorizon.com.br
      middlewares:
        - secure-headers
      priority: 20

    # Router WWW — redirect 301 pro APEX (HTTPS)
    https-lp-horizon-www:
      rule: "Host(`www.consultoriahorizon.com.br`)"
      entryPoints:
        - https
      service: lp-horizon-svc
      tls:
        certResolver: letsencrypt
      middlewares:
        - redirect-www-to-apex
        - secure-headers
      priority: 20

    # Redirect HTTP → HTTPS (cobre apex + www)
    http-lp-horizon-redirect:
      rule: "Host(`consultoriahorizon.com.br`) || Host(`www.consultoriahorizon.com.br`)"
      entryPoints:
        - http
      service: lp-horizon-svc
      middlewares:
        - redirect-to-https
      priority: 20

  services:
    lp-horizon-svc:
      loadBalancer:
        servers:
          - url: "http://lp-horizon:3000"
        passHostHeader: true

  middlewares:
    redirect-www-to-apex:
      redirectRegex:
        regex: "^https?://www\\.consultoriahorizon\\.com\\.br/(.*)"
        replacement: "https://consultoriahorizon.com.br/${1}"
        permanent: true

    redirect-to-https:
      redirectScheme:
        scheme: "https"
        permanent: true

    secure-headers:
      headers:
        stsSeconds: 31536000
        stsIncludeSubdomains: true
        stsPreload: true
        forceSTSHeader: true
        contentTypeNosniff: true
        browserXssFilter: true
        referrerPolicy: "strict-origin-when-cross-origin"
        frameDeny: true

# Deploy pipeline — mesmo padrão do DocsGrowth (build → GHCR → SSH VPS → docker compose pull+up)
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Typecheck
        run: npx tsc --noEmit

      # O blog saiu do repositório (virou WordPress em /blog), e com ele o
      # blog-build-output.test.ts que este comentário citava. O Build continua
      # sendo pré-requisito do Test por outra razão, ainda viva: as guardas de
      # HTML pré-renderizado da HOME — app/(home)/build-output.test.ts e
      # app/(home)/blog-ancoras.test.ts — leem .next/server/app/index.html e são
      # puladas em SILÊNCIO (describe.skipIf) quando esse HTML não existe. Sem
      # este passo antes do Test, o pipeline fica verde mesmo se a home perder o
      # canonical, o og:image, uma das 8 dobras, ou uma das âncoras que o tema do
      # blog consome — exatamente os casos que essas guardas existem para pegar.
      - name: Build
        run: npm run build

      - name: Test
        run: npm test

  build-and-push:
    needs: verify
    runs-on: ubuntu-latest
    outputs:
      image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Sync Traefik config to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          # SSH da VPS CodeUP mudou 22 → 2289 no hardening de 2026-06-18 (Pilar 1).
          # Sem isto a action tenta a 22, que está FECHADA, e o deploy nunca chega na VPS.
          # Ver sdds/sdd-2026-06-18-VPS-SSH-HARDENING-ROLLOUT no vault.
          port: ${{ secrets.VPS_SSH_PORT || 2289 }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: "infra/traefik/lp-horizon.yml,compose.yml"
          target: "/opt/lp-horizon/"
          strip_components: 0
          overwrite: true

      - name: Deploy on VPS via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          port: ${{ secrets.VPS_SSH_PORT || 2289 }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -euo pipefail
            cd /opt/lp-horizon

            # Sincroniza config Traefik no diretório que o file-provider observa
            sudo cp infra/traefik/lp-horizon.yml /etc/easypanel/traefik/config/lp-horizon.yml

            # Login GHCR pra pull da image privada (se ficar privada — public funciona sem)
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin || true

            # Pull + recreate
            docker compose pull
            docker compose up -d --remove-orphans

            # Health check — apex E /blog. O passo que sincroniza
            # infra/traefik/lp-horizon.yml é justamente o que pode derrubar o
            # /blog (router de prioridade 30, stripPrefix, passHostHeader), e a
            # tabela de risco da spec manda testar os dois. Testar só o apex
            # deixaria o blog quebrar em silêncio no deploy que o quebrou.
            sleep 5
            docker compose ps
            curl -sSf https://consultoriahorizon.com.br/ -o /dev/null && echo "smoke apex OK" || echo "smoke apex FAILED (talvez TLS LE ainda emitindo)"
            curl -sSf https://consultoriahorizon.com.br/blog/ -o /dev/null && echo "smoke blog OK" || echo "smoke blog FAILED"
